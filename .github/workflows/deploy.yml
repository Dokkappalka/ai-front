name: Deploy Frontend
on:
  push:
    branches:
      - production
jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/production'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push frontend image
        if: github.ref == 'refs/heads/production'
        uses: docker/build-push-action@v5
        with:
          context: ./
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-hype-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-hype-frontend:latest
          
      - name: Setup SSH Key
        if: github.ref == 'refs/heads/production'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          
      - name: Deploy to server
        if: github.ref == 'refs/heads/production'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /opt/ai-hype
            export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}"
            export FRONTEND_VERSION="${GITHUB_SHA}"
            export BACKEND_VERSION=$(cat backend_version.txt 2>/dev/null || echo "latest")
            echo "${GITHUB_SHA}" > frontend_version.txt
            docker pull ${DOCKERHUB_USERNAME}/ai-hype-frontend:${GITHUB_SHA}
            docker-compose up -d frontend
            docker image prune -f
          EOF

      - name: Copy nginx.conf to server
        if: github.ref == 'refs/heads/production'
        run: |
          scp -i ~/.ssh/deploy_key nginx.conf ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/ai-hype/nginx.conf

      - name: Restart nginx
        if: github.ref == 'refs/heads/production'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'docker exec ai-hype-frontend_1 nginx -s reload'
          
      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key