name: Deploy Frontend

on:
  push:
    branches:
      - main
      - production
    paths:
      - 'frontend/**'
  pull_request:
    branches:
      - main
      - production

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/production'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        if: github.ref == 'refs/heads/production'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/ai-hype
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-hype-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ai-hype-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ai-hype-frontend:buildcache,mode=max

      - name: Build and push latest tag
        if: github.ref == 'refs/heads/production'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/ai-hype
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-hype-frontend:latest

      - name: Deploy to server
        if: github.ref == 'refs/heads/production'
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/ai-hype
            echo "${{ github.sha }}" > frontend_version.txt
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ai-hype-frontend:${{ github.sha }}
            docker-compose pull frontend
            docker-compose up -d frontend
            docker image prune -f
